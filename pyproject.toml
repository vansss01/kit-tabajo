[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = [".venv", ".cache", "tmp", "results", "data", "vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]

[tool.mypy]
python_version = "3.11"
files = ["src", "kit.py", "scripts", "tests"]
check_untyped_defs = true
ignore_missing_imports = true
cache_dir = ".cache/mypy"
